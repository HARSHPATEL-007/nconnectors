version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: nova-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: nova
      MONGO_INITDB_ROOT_PASSWORD: nova_password_2026
      MONGO_INITDB_DATABASE: nova_chat
    networks:
      - nova-network

  redis:
    image: redis:7-alpine
    container_name: nova-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass nova_redis_2026
    networks:
      - nova-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nova-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=mongodb://nova:nova_password_2026@mongodb:27017/nova_chat?authSource=admin
      - REDIS_URL=redis://:nova_redis_2026@redis:6379
      - JWT_SECRET=nova_chat_jwt_secret_key_2026_change_in_production
      - AI_SERVICE_URL=http://ai-service:8000
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
    depends_on:
      - mongodb
      - redis
    networks:
      - nova-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: nova-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
      - DEVICE=cpu
    volumes:
      - ai_models:/app/models
    networks:
      - nova-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nova-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
    depends_on:
      - backend
    networks:
      - nova-network

  nginx:
    image: nginx:alpine
    container_name: nova-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - nova-network

volumes:
  mongodb_data:
  redis_data:
  ai_models:

networks:
  nova-network:
    driver: bridge
