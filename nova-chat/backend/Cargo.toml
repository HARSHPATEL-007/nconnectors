[package]
name = "nova-chat-backend"
version = "0.1.0"
edition = "2021"
description = "N0VA Chat - Hyper-Scale Team Messaging Backend"

[dependencies]
actix-web = "4.4"
actix-ws = "0.2"
actix-cors = "0.7"
async-trait = "0.1"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mongodb = "2.8"
bson = { version = "2.9", features = ["chrono-0_4"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
jsonwebtoken = "9.2"
bcrypt = "0.15"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
futures = "0.3"
futures-util = "0.3"
thiserror = "1.0"
validator = { version = "0.16", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
dashmap = "5.5"
parking_lot = "0.12"
url = "2.5"
mime = "0.3"

[profile.release]
opt-level = 3
lto = true
